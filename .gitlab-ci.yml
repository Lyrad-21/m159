# GitLab Pages für Modul 159
#
# Baut die Lernunterlagen mit mdBook zu einer statischen Website und
# veröffentlicht sie unter GitLab Pages (nur auf dem Default-Branch).
#
# Die Buch-Quelle wird von pages-src/build.sh aus den bestehenden
# Modul-Ordnern zusammengestellt; das Repo selbst bleibt unverändert.

image: debian:bookworm-slim

variables:
  MDBOOK_VERSION: "0.4.51"
  MDBOOK_ALERTS_VERSION: "0.8.0"

pages:
  stage: deploy
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar
    - mkdir -p bin
    # mdBook (statische Site) herunterladen
    - curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C bin
    # mdbook-alerts (rendert die > [!TIP] / [!WARNING] Hinweisboxen)
    - curl -sSL -o bin/mdbook-alerts "https://github.com/lambdalisue/rs-mdbook-alerts/releases/download/v${MDBOOK_ALERTS_VERSION}/mdbook-alerts-x86_64-unknown-linux-gnu"
    - chmod +x bin/mdbook-alerts
    - export PATH="$CI_PROJECT_DIR/bin:$PATH"
    - bash pages-src/build.sh
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
